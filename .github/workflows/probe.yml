name: oi-probe

# Temporary: logs Cboe's open-interest totals twice an hour on weekdays, 04:07 to 14:37 UTC, so we can see WHEN open
# interest updates (about 44 downloads a day for 2 to 3 weekdays, then this file is deleted in plan Task 8).
# Ignore Monday's rows when reading the result: they span the weekend.
on:
  schedule:
    - cron: '7,37 4-14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m gex.probe
      - name: Save the log
        run: |
          git config user.name "gex-bot"
          git config user.email "gex-bot@users.noreply.github.com"
          git add probe
          git diff --cached --quiet || git commit -m "probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
